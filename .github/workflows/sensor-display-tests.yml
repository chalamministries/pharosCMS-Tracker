name: Sensor display tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sensor-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/map-battery.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pydantic==2.12.5
      - run: python -m unittest discover -s tests -p 'test_sensor_labels.py' -v
