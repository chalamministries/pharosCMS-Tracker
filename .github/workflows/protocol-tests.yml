name: H02 protocol tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  h02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pydantic==2.12.5
      - run: python -m unittest discover -s tests -p 'test_h02_v8.py' -v
